[package]
name = "miner-api"
version = "0.1.2"
edition = "2021"
description = "Instructions, state and SDK for the MINER protocol - a proof-of-work mined SPL token where holdings boost mining power"
license = "MIT"
homepage = "https://miner.tools"
documentation = "https://miner.tools"

[features]
# Devnet rehearsal build: halvings every 5 minutes from a near-now anchor,
# so the full schedule can be observed live on a real cluster. NEVER enable
# for a mainnet artifact.
short-halving = []

[dependencies]
solana-program = { workspace = true }
bytemuck = { workspace = true }
