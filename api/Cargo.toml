[package]
name = "miner-api"
version = "0.3.0"
edition = "2021"
description = "Instructions, state and SDK for the MINER protocol - a proof-of-work mined SPL token where holdings boost mining power"
license = "MIT"
homepage = "https://miner.tools"
documentation = "https://miner.tools"

[features]
# Devnet rehearsal build: halvings every 5 minutes from a near-now anchor,
# so the full schedule can be observed live on a real cluster. NEVER enable
# for a mainnet artifact.
short-halving = []
# Devnet rehearsal build: lock tiers in minutes instead of days, so a full
# lock -> mine -> expire -> withdraw cycle can be observed live. NEVER
# enable for a mainnet artifact.
short-lock = []
# Devnet rehearsal build: the Motherlode draw strikes on every round close,
# so the accrue -> win -> claim -> burn cycle can be observed live. NEVER
# enable for a mainnet artifact.
short-motherlode = []
# Devnet rehearsal build: 1-minute game rounds and 1-in-3 players'
# Motherlode strike odds, so full game cycles can be observed live. NEVER
# enable for a mainnet artifact.
short-game = []

[dependencies]
solana-program = { workspace = true }
bytemuck = { workspace = true }
