[package]
name = "miner-cli"
version = "0.1.2"
edition = "2021"
description = "CLI miner for the MINER protocol on Solana - mine, claim and inspect from your terminal (binary: miner)"
license = "MIT"
homepage = "https://miner.tools"
documentation = "https://miner.tools"

[[bin]]
name = "miner"
path = "src/main.rs"

[dependencies]
miner-api = { workspace = true }
bytemuck = { workspace = true }
solana-sdk = "4"
solana-rpc-client = "4"
solana-commitment-config = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
