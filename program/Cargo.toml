[package]
name = "miner-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
# Forwarded to miner-api: devnet rehearsal with 5-minute halvings.
short-halving = ["miner-api/short-halving"]
# Forwarded to miner-api: devnet rehearsal with minute-scale lock tiers.
short-lock = ["miner-api/short-lock"]
# Forwarded to miner-api: devnet rehearsal with a draw on every round close.
short-motherlode = ["miner-api/short-motherlode"]
# Forwarded to miner-api: devnet rehearsal with 1-minute game rounds and
# frequent players' Motherlode strikes.
short-game = ["miner-api/short-game"]
# Devnet rehearsal: skip the pool read, the price EMA keeps its init value
# (no cp-amm pool exists on devnet). NEVER enable for a mainnet artifact.
game-fixed-price = []

[dependencies]
miner-api = { workspace = true }
solana-program = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
litesvm = "0.15"
solana-sdk = "4"
